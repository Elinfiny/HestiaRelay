name: Public video playback

on:
  pull_request:
    paths:
      - scripts/verify_public_video.py
      - .github/workflows/public-video.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-out-playback:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned browser client
        run: python -m pip install playwright==1.62.0
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Observe one complete public playback without credentials
        run: python scripts/verify_public_video.py
      - name: Preserve the actual observation even when blocked
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-video-playback
          path: qa-public-video/
          if-no-files-found: error
