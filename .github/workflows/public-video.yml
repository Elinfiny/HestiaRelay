name: Public video playback

on:
  pull_request:
    paths:
      - scripts/verify_public_video.py
      - .github/workflows/public-video.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-out-playback:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned browser client
        run: python -m pip install playwright==1.62.0
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Observe one complete public playback without credentials
        run: python scripts/verify_public_video.py
      - name: Preserve the actual observation even when blocked
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-video-playback
          path: qa-public-video/
          if-no-files-found: error
