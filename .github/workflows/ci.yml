name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=hestiarelay --cov-report=term-missing -s | tee validation.txt
      - name: Audit isolated narration dependencies
        run: |
          python -m venv /tmp/hestiarelay-media-audit
          /tmp/hestiarelay-media-audit/bin/pip install pip-audit==2.10.1
          /tmp/hestiarelay-media-audit/bin/pip-audit --strict --disable-pip --no-deps -r requirements-media.txt -f json -o media-advisories.json
      - name: Save validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation
          path: |
            validation.txt
            media-advisories.json
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and browser runner
        run: python -m pip install -e ".[dev]" playwright==1.62.0
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Exercise desktop and mobile
        run: python scripts/browser_qa.py
      - name: Exercise authenticated TLS and recovery
        run: python scripts/judge_qa.py
      - name: Install video encoder
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg
      - name: Record judge demonstration candidate
        run: python scripts/record_demo.py
      - name: Scan browser and demo artifacts for secrets
        run: bash scripts/scan_browser_artifacts.sh
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-qa
          path: qa-artifacts/
  cloud-proof-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-proof.txt
      - name: Reproduce the pinned proof environment
        run: python -m pip install -r requirements-proof.txt
      - name: Validate cloud runner and offline gates
        env:
          PYTHONPATH: src
        run: |
          python -m pip check
          bash -n scripts/run_cloud_proof.sh
          ruff check .
          pytest --cov=hestiarelay --cov-report=term-missing
      - name: Validate CloudFormation schema without AWS credentials
        run: |
          python -m venv /tmp/hestiarelay-cfn-check
          /tmp/hestiarelay-cfn-check/bin/pip install cfn-lint==1.56.3
          /tmp/hestiarelay-cfn-check/bin/cfn-lint --region us-east-1 --template infra/bedrock-proof.json
  container-judge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install validation clients
        run: |
          python -m pip install -e ".[dev]" playwright==1.62.0
          python -m playwright install --with-deps chromium
          npm install --prefix /tmp/hestiarelay-inspector --no-audit --no-fund @modelcontextprotocol/inspector@2.6.0
      - name: Build the application image
        run: |
          mkdir -p qa-artifacts
          docker build --pull --tag hestiarelay:judge .
          cp Dockerfile qa-artifacts/Dockerfile
          cp /tmp/hestiarelay-inspector/package-lock.json qa-artifacts/inspector-package-lock.json
      - name: Verify the real container and clients
        run: python scripts/container_qa.py --inspector /tmp/hestiarelay-inspector/node_modules/.bin/mcp-inspector
      - name: Install build audit coverage
        run: python -m pip install cfn-lint==1.56.3 setuptools==84.0.0
      - name: Audit release image, build chain and Git history
        run: bash scripts/release_audit.sh
      - name: Save container and browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-judge
          path: qa-artifacts/
