name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=hestiarelay --cov-report=term-missing -s | tee validation.txt
      - name: Audit isolated narration dependencies
        run: |
          python -m venv /tmp/hestiarelay-media-audit
          /tmp/hestiarelay-media-audit/bin/pip install pip-audit==2.10.1
          /tmp/hestiarelay-media-audit/bin/pip-audit --strict --disable-pip --no-deps -r requirements-media.txt -f json -o media-advisories.json
      - name: Bound validation evidence without changing originals
        if: always()
        id: bound_validation
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, stat, zipfile
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          job = os.environ['GITHUB_JOB']
          spec = {'validate': (1048576, 65536, 65536, 16, ['validation.txt', 'media-advisories.json']), 'browser': (67108864, 1048576, 1048576, 512, ['qa-artifacts']), 'container-judge': (33554432, 1048576, 1048576, 256, ['qa-artifacts'])}[job]
          original_cap, metadata_cap, zip_overhead_cap, file_cap, names = spec
          cap = original_cap + metadata_cap + zip_overhead_cap
          stage = pathlib.Path(os.environ['RUNNER_TEMP']) / ('hestia-ci-' + job + '-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          stage.mkdir(mode=0o700, exist_ok=False)
          chosen = []
          def visit(p):
              mode = p.lstat().st_mode
              if stat.S_ISLNK(mode):
                  raise ValueError('symlink refused; original retained runner-local')
              if stat.S_ISDIR(mode):
                  for child in sorted(p.iterdir()):
                      visit(child)
              elif stat.S_ISREG(mode):
                  chosen.append(p)
                  if len(chosen) > file_cap:
                      raise ValueError('filecount refused; no partial upload')
              else:
                  raise ValueError('nonregular refused; no partial upload')
          for name in names:
              p = root / name
              if p.exists() or p.is_symlink():
                  visit(p)
          if not chosen:
              raise ValueError('no originals; no complete artifact claimed')
          rows, original_total = [], 0
          archive = stage / {'validate': 'validation-evidence.zip', 'browser': 'browser-evidence.zip', 'container-judge': 'container-judge-evidence.zip'}[job]
          with zipfile.ZipFile(archive, 'x', compression=zipfile.ZIP_STORED, allowZip64=False) as z:
              for p in chosen:
                  rel = p.relative_to(root).as_posix()
                  if len(rel.encode('utf-8')) > 512:
                      raise ValueError('path bound refused')
                  fd = os.open(p, os.O_RDONLY | os.O_NOFOLLOW)
                  with os.fdopen(fd, 'rb') as f:
                      before = os.fstat(f.fileno())
                      if not stat.S_ISREG(before.st_mode):
                          raise ValueError('type changed; no upload')
                      b = f.read(original_cap - original_total + 1)
                      after = os.fstat(f.fileno())
                  if len(b) != before.st_size or (before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns, before.st_ctime_ns) != (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_ctime_ns):
                      raise ValueError('original changed/oversize; no upload')
                  original_total += len(b)
                  if original_total > original_cap:
                      raise ValueError('original byte bound; no truncation/reencoding')
                  z.writestr(rel, b)
                  rows.append({'path': rel, 'bytes': len(b), 'sha256': hashlib.sha256(b).hexdigest()})
              metadata = json.dumps({'job': job, 'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'retention_days': 1, 'originals': rows}, sort_keys=True, indent=2).encode()
              if len(metadata) > metadata_cap:
                  raise ValueError('metadata cap; no partial upload')
              z.writestr('EVIDENCE_MANIFEST.json', metadata)
          size = archive.stat().st_size
          overhead = size - original_total - len(metadata)
          if overhead > zip_overhead_cap or size > cap:
              raise ValueError('actual ZIP overhead/total bound; no upload')
          with zipfile.ZipFile(archive) as z:
              if z.testzip() is not None:
                  raise ValueError('CRC refused')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('allowed=true\npath=' + str(archive) + '\nbytes=' + str(size) + '\n')
          print(json.dumps({'job': job, 'original_bytes': original_total, 'metadata_bytes': len(metadata), 'zip_overhead_bytes': overhead, 'actual_upload_bytes': size, 'cap': cap, 'original_filecount': len(rows), 'upload_filecount': 1, 'artifact_attempts': 1}))
          PY
      - name: Save validation evidence once, all bytes bounded
        if: ${{ always() && steps.bound_validation.outputs.allowed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.bound_validation.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 1
          overwrite: false
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install application and browser runner
        run: python -m pip install -e ".[dev]" playwright==1.62.0
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Exercise desktop and mobile
        run: python scripts/browser_qa.py
      - name: Exercise authenticated TLS and recovery
        run: python scripts/judge_qa.py
      - name: Install video encoder
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg
      - name: Record judge demonstration candidate
        run: python scripts/record_demo.py
      - name: Scan browser and demo artifacts for secrets
        run: bash scripts/scan_browser_artifacts.sh
      - name: Bound browser evidence without changing originals
        if: always()
        id: bound_browser
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, stat, zipfile
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          job = os.environ['GITHUB_JOB']
          spec = {'validate': (1048576, 65536, 65536, 16, ['validation.txt', 'media-advisories.json']), 'browser': (67108864, 1048576, 1048576, 512, ['qa-artifacts']), 'container-judge': (33554432, 1048576, 1048576, 256, ['qa-artifacts'])}[job]
          original_cap, metadata_cap, zip_overhead_cap, file_cap, names = spec
          cap = original_cap + metadata_cap + zip_overhead_cap
          stage = pathlib.Path(os.environ['RUNNER_TEMP']) / ('hestia-ci-' + job + '-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          stage.mkdir(mode=0o700, exist_ok=False)
          chosen = []
          def visit(p):
              mode = p.lstat().st_mode
              if stat.S_ISLNK(mode):
                  raise ValueError('symlink refused; original retained runner-local')
              if stat.S_ISDIR(mode):
                  for child in sorted(p.iterdir()):
                      visit(child)
              elif stat.S_ISREG(mode):
                  chosen.append(p)
                  if len(chosen) > file_cap:
                      raise ValueError('filecount refused; no partial upload')
              else:
                  raise ValueError('nonregular refused; no partial upload')
          for name in names:
              p = root / name
              if p.exists() or p.is_symlink():
                  visit(p)
          if not chosen:
              raise ValueError('no originals; no complete artifact claimed')
          rows, original_total = [], 0
          archive = stage / {'validate': 'validation-evidence.zip', 'browser': 'browser-evidence.zip', 'container-judge': 'container-judge-evidence.zip'}[job]
          with zipfile.ZipFile(archive, 'x', compression=zipfile.ZIP_STORED, allowZip64=False) as z:
              for p in chosen:
                  rel = p.relative_to(root).as_posix()
                  if len(rel.encode('utf-8')) > 512:
                      raise ValueError('path bound refused')
                  fd = os.open(p, os.O_RDONLY | os.O_NOFOLLOW)
                  with os.fdopen(fd, 'rb') as f:
                      before = os.fstat(f.fileno())
                      if not stat.S_ISREG(before.st_mode):
                          raise ValueError('type changed; no upload')
                      b = f.read(original_cap - original_total + 1)
                      after = os.fstat(f.fileno())
                  if len(b) != before.st_size or (before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns, before.st_ctime_ns) != (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_ctime_ns):
                      raise ValueError('original changed/oversize; no upload')
                  original_total += len(b)
                  if original_total > original_cap:
                      raise ValueError('original byte bound; no truncation/reencoding')
                  z.writestr(rel, b)
                  rows.append({'path': rel, 'bytes': len(b), 'sha256': hashlib.sha256(b).hexdigest()})
              metadata = json.dumps({'job': job, 'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'retention_days': 1, 'originals': rows}, sort_keys=True, indent=2).encode()
              if len(metadata) > metadata_cap:
                  raise ValueError('metadata cap; no partial upload')
              z.writestr('EVIDENCE_MANIFEST.json', metadata)
          size = archive.stat().st_size
          overhead = size - original_total - len(metadata)
          if overhead > zip_overhead_cap or size > cap:
              raise ValueError('actual ZIP overhead/total bound; no upload')
          with zipfile.ZipFile(archive) as z:
              if z.testzip() is not None:
                  raise ValueError('CRC refused')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('allowed=true\npath=' + str(archive) + '\nbytes=' + str(size) + '\n')
          print(json.dumps({'job': job, 'original_bytes': original_total, 'metadata_bytes': len(metadata), 'zip_overhead_bytes': overhead, 'actual_upload_bytes': size, 'cap': cap, 'original_filecount': len(rows), 'upload_filecount': 1, 'artifact_attempts': 1}))
          PY
      - name: Save browser evidence once, all bytes bounded
        if: ${{ always() && steps.bound_browser.outputs.allowed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.bound_browser.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 1
          overwrite: false
  cloud-proof-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Reproduce the pinned proof environment
        run: python -m pip install -r requirements-proof.txt
      - name: Validate cloud runner and offline gates
        env:
          PYTHONPATH: src
        run: |
          python -m pip check
          bash -n scripts/run_cloud_proof.sh
          ruff check .
          pytest --cov=hestiarelay --cov-report=term-missing
      - name: Validate CloudFormation schema without AWS credentials
        run: |
          python -m venv /tmp/hestiarelay-cfn-check
          /tmp/hestiarelay-cfn-check/bin/pip install cfn-lint==1.56.3
          /tmp/hestiarelay-cfn-check/bin/cfn-lint --region us-east-1 --template infra/bedrock-proof.json
  container-judge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install validation clients
        run: |
          python -m pip install -e ".[dev]" playwright==1.62.0
          python -m playwright install --with-deps chromium
          npm ci --prefix tools/inspector --ignore-scripts --no-audit --no-fund
      - name: Build the application image
        run: |
          mkdir -p qa-artifacts
          docker build --pull --tag hestiarelay:judge .
          cp Dockerfile qa-artifacts/Dockerfile
          cp tools/inspector/package-lock.json qa-artifacts/inspector-package-lock.json
      - name: Verify the real container and clients
        run: python scripts/container_qa.py --inspector tools/inspector/node_modules/.bin/mcp-inspector
      - name: Install build audit coverage
        run: python -m pip install cfn-lint==1.56.3 setuptools==84.0.0
      - name: Read-only scoped Perl inventory before release audit
        id: perl_inventory
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import hashlib, importlib.util, json, os, pathlib, re, stat, sys, time
          sys.dont_write_bytecode = True
          root = pathlib.Path.cwd()
          runid, attempt = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']
          if not re.fullmatch(r'[0-9]+', runid) or attempt != '1':
              raise ValueError('native run identity/attempt not admitted; no replay')
          stage = pathlib.Path(os.environ['RUNNER_TEMP']) / ('hestia-perl16-' + runid)
          stage.mkdir(mode=0o700, exist_ok=False)
          evidence = root / 'qa-artifacts' / ('perl16-' + runid)
          evidence.mkdir(mode=0o700, exist_ok=False)
          expected = {'perl_scoped_inventory.py': '8b21a3e66c5c520c9c3f1dfd5b4058b5ec969e8f637cb1dec7317fb61613c516', 'healthcheck_qualification.py': '577380fe3339e8f00b9f447e847f65335ff8841937494015332d8880f399892d'}
          audit = stage / 'audit'
          audit.mkdir(mode=0o755)
          for name, digest in expected.items():
              if not stat.S_ISREG((root / 'scripts' / name).lstat().st_mode) or (root / 'scripts' / name).stat().st_size > 32768:
                  raise ValueError('reviewed15 script type/size mismatch')
              data = (root / 'scripts' / name).read_bytes()
              if hashlib.sha256(data).hexdigest() != digest:
                  raise ValueError('reviewed15 script identity mismatch')
              (audit / name).write_bytes(data)
              (audit / name).chmod(0o444)
          spec = importlib.util.spec_from_file_location('reviewed15_helper', audit / 'healthcheck_qualification.py')
          helper = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(helper)
          state = {'calls': [], 'retained_bytes': 0, 'first_unknown': None, 'cleanup_issued': []}
          start = time.monotonic()
          limit, reserve = 60.0, 8.0
          name = 'hestiarelay-perl16-' + runid
          owned = None
          docker_calls = 0
          primary = None
          terminal = False
          cleanup_ok = False
          image_id = None
          source_rows = []
          def command(label, argv, seconds, cleanup=False):
              global docker_calls
              if argv[0] == 'docker':
                  docker_calls += 1
                  if docker_calls > 6:
                      raise ValueError('six Docker command cap')
              remaining = limit - (time.monotonic() - start) - (0 if cleanup else reserve)
              if remaining <= 0:
                  raise ValueError('caller deadline; no fresh functional command')
              return helper.bounded_command(label, argv, min(seconds, remaining), evidence, state, cleanup=cleanup)
          try:
              # Source-file domain: public finite snapshot, exact Git blobs at d3f15.
              tree = command('source-tree', ['git', 'ls-tree', '-r', '-z', 'd3f15f3fa4347dc781e43479282c6372d80ddbc0'], 5)
              source = stage / 'source'
              source.mkdir(mode=0o755)
              fixed = {'Dockerfile', 'requirements-runtime.txt', 'scripts/container_qa.py', 'scripts/release_audit.sh', 'scripts/release_inventory.py', 'scripts/run_cloud_proof.sh'}
              selected = []
              for item in tree.decode().split('\0'):
                  if not item:
                      continue
                  meta, rel = item.split('\t', 1)
                  mode, kind, blob = meta.split()
                  if rel in fixed or (rel.startswith('src/hestiarelay/') and rel.endswith('.py')):
                      if kind != 'blob' or mode not in {'100644', '100755'} or '..' in pathlib.PurePosixPath(rel).parts or len(selected) >= 96:
                          raise ValueError('source projection bound/type')
                      selected.append((rel, blob))
              if not fixed.issubset({rel for rel, _ in selected}):
                  raise ValueError('source projection incomplete')
              total = 0
              for rel, blob in selected:
                  p = root / rel
                  if not stat.S_ISREG(p.lstat().st_mode) or p.stat().st_size > 1024 * 1024:
                      raise ValueError('source leaf type/size')
                  with p.open('rb') as f:
                      data = f.read(1024 * 1024 + 1)
                  total += len(data)
                  if total > 2 * 1024 * 1024 or hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() != blob:
                      raise ValueError('source hash drift; do not substitute/mount current files')
                  dest = source / rel
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.parent.chmod(0o755)
                  dest.write_bytes(data)
                  dest.chmod(0o444)
                  source_rows.append({'path': rel, 'git_blob': blob, 'sha256': hashlib.sha256(data).hexdigest()})
              # Installed-image domain is separate: inspect actual image built by this job.
              images = json.loads(command('image-before', ['docker', 'image', 'inspect', 'hestiarelay:judge'], 5))
              image_id = images[0]['Id']
              if not re.fullmatch(r'sha256:[0-9a-f]{64}', image_id) or images[0]['Config'].get('User') != '10001:10001':
                  raise ValueError('image ID/user not proved')
              output = evidence / 'container-output'
              output.mkdir(mode=0o700)
              command('own-new-output', ['sudo', 'chown', '10001:10001', str(output)], 3)
              empty = stage / 'empty-data'
              empty.mkdir(mode=0o555)
              argv = ['docker', 'create', '--name', name, '--network', 'none', '--read-only', '--cap-drop', 'ALL', '--security-opt', 'no-new-privileges', '--user', '10001:10001', '--cpus', '1', '--memory', '512m', '--pids-limit', '128', '--mount', 'type=bind,src=' + str(source) + ',dst=/source,readonly', '--mount', 'type=bind,src=' + str(audit) + ',dst=/audit,readonly', '--mount', 'type=bind,src=' + str(empty) + ',dst=/data,readonly', '--mount', 'type=bind,src=' + str(output) + ',dst=/evidence', '--entrypoint', 'python', image_id, '/audit/perl_scoped_inventory.py', '--source', '/source', '--output', '/evidence/perl16', '--image-id', image_id]
              # Docker name reservation is atomic. Collision or ambiguous create never adopts.
              cid = command('create-once', argv, 5).decode().strip()
              if not re.fullmatch(r'[0-9a-f]{64}', cid):
                  raise ValueError('create identity unknown; no adopt/rm by name')
              owned = cid
              command('start-attached-once', ['docker', 'start', '--attach', owned], 33)
          except Exception as error:
              primary = {'type': type(error).__name__, 'message': str(error)}
          finally:
              if owned is not None:
                  try:
                      observed = json.loads(command('terminal-once', ['docker', 'inspect', owned], 3, cleanup=True))[0]
                      terminal = observed['Id'] == owned and observed['Image'] == image_id and observed['State']['Running'] is False and observed['State']['ExitCode'] == 0
                  except Exception as error:
                      if primary is None:
                          primary = {'type': type(error).__name__, 'message': str(error)}
                  try:
                      command('cleanup-owned-once', ['docker', 'rm', '--force', '--volumes', owned], 5, cleanup=True)
                      cleanup_ok = True
                  except Exception as error:
                      if primary is None:
                          primary = {'type': type(error).__name__, 'message': str(error)}
              # Only own-output metadata changes, after proved backend exit and cleanup.
              if terminal and cleanup_ok:
                  try:
                      command('restore-output-custody', ['sudo', 'chown', '-R', '--no-dereference', str(os.getuid()) + ':' + str(os.getgid()), str(output)], 3, cleanup=True)
                  except Exception as error:
                      if primary is None:
                          primary = {'type': type(error).__name__, 'message': str(error)}
          report = None
          if terminal and cleanup_ok and primary is None and state['first_unknown'] is None:
              path = output / 'perl16/PERL_SCOPED_INVENTORY.json'
              if not stat.S_ISDIR(path.parent.lstat().st_mode) or not stat.S_ISREG(path.lstat().st_mode) or path.stat().st_size > 1024 * 1024:
                  raise ValueError('report custody/type/size incomplete')
              report = json.loads(path.read_bytes())
          accepted = primary is None and terminal and cleanup_ok and state['first_unknown'] is None and report is not None and report['state'] == 'COMPLETE_SUBSCOPES_AT_SAMPLE_NOT_SECURITY_ACCEPTANCE' and time.monotonic() - start < limit
          result = {'scope': 'READONLY_PERL_INVENTORY_NOT_SECURITY_PASS', 'accepted': accepted, 'primary': primary, 'first_unknown': state['first_unknown'], 'calls': state['calls'], 'image_id_observed': image_id, 'source_commit': 'd3f15f3fa4347dc781e43479282c6372d80ddbc0', 'source_file_domain': source_rows, 'installed_image_domain': 'dpkg/module bytes from inspected image; mounted source is not proof of installed application-code equivalence', 'old_POSIX_proof_inherited': False, 'terminal_exit0_proved': terminal, 'cleanup_owned': cleanup_ok, 'docker_commands': docker_calls, 'backend_stop': 'PROVED_OWNED_EXIT_AND_RM' if terminal and cleanup_ok else 'UNKNOWN', 'security_gate': 'OS6OPEN/PerlUNKNOWN/Sept27expiryHOLD until independent review'}
          helper.write(evidence / 'PERL_CALLER_RESULT.json', result)
          if time.monotonic() - start >= limit:
              accepted = False
              helper.write(evidence / 'PERL_CALLER_CLOSEOUT.json', {'accepted': False, 'state': 'UNKNOWN', 'reason': 'final_report_persist_return_late', 'original_result_unchanged': True})
          raise SystemExit(0 if accepted else 2)
          PY
      - name: Audit release image, build chain and Git history
        run: bash scripts/release_audit.sh
      - name: Require completed scoped Perl inventory
        if: always()
        env:
          PERL_INVENTORY_OUTCOME: ${{ steps.perl_inventory.outcome }}
        run: test "$PERL_INVENTORY_OUTCOME" = success
      - name: Bound container evidence without changing originals
        if: always()
        id: bound_container
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, stat, zipfile
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          job = os.environ['GITHUB_JOB']
          spec = {'validate': (1048576, 65536, 65536, 16, ['validation.txt', 'media-advisories.json']), 'browser': (67108864, 1048576, 1048576, 512, ['qa-artifacts']), 'container-judge': (33554432, 1048576, 1048576, 256, ['qa-artifacts'])}[job]
          original_cap, metadata_cap, zip_overhead_cap, file_cap, names = spec
          cap = original_cap + metadata_cap + zip_overhead_cap
          stage = pathlib.Path(os.environ['RUNNER_TEMP']) / ('hestia-ci-' + job + '-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          stage.mkdir(mode=0o700, exist_ok=False)
          chosen = []
          def visit(p):
              mode = p.lstat().st_mode
              if stat.S_ISLNK(mode):
                  raise ValueError('symlink refused; original retained runner-local')
              if stat.S_ISDIR(mode):
                  for child in sorted(p.iterdir()):
                      visit(child)
              elif stat.S_ISREG(mode):
                  chosen.append(p)
                  if len(chosen) > file_cap:
                      raise ValueError('filecount refused; no partial upload')
              else:
                  raise ValueError('nonregular refused; no partial upload')
          for name in names:
              p = root / name
              if p.exists() or p.is_symlink():
                  visit(p)
          if not chosen:
              raise ValueError('no originals; no complete artifact claimed')
          rows, original_total = [], 0
          archive = stage / {'validate': 'validation-evidence.zip', 'browser': 'browser-evidence.zip', 'container-judge': 'container-judge-evidence.zip'}[job]
          with zipfile.ZipFile(archive, 'x', compression=zipfile.ZIP_STORED, allowZip64=False) as z:
              for p in chosen:
                  rel = p.relative_to(root).as_posix()
                  if len(rel.encode('utf-8')) > 512:
                      raise ValueError('path bound refused')
                  fd = os.open(p, os.O_RDONLY | os.O_NOFOLLOW)
                  with os.fdopen(fd, 'rb') as f:
                      before = os.fstat(f.fileno())
                      if not stat.S_ISREG(before.st_mode):
                          raise ValueError('type changed; no upload')
                      b = f.read(original_cap - original_total + 1)
                      after = os.fstat(f.fileno())
                  if len(b) != before.st_size or (before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns, before.st_ctime_ns) != (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_ctime_ns):
                      raise ValueError('original changed/oversize; no upload')
                  original_total += len(b)
                  if original_total > original_cap:
                      raise ValueError('original byte bound; no truncation/reencoding')
                  z.writestr(rel, b)
                  rows.append({'path': rel, 'bytes': len(b), 'sha256': hashlib.sha256(b).hexdigest()})
              metadata = json.dumps({'job': job, 'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'retention_days': 1, 'originals': rows}, sort_keys=True, indent=2).encode()
              if len(metadata) > metadata_cap:
                  raise ValueError('metadata cap; no partial upload')
              z.writestr('EVIDENCE_MANIFEST.json', metadata)
          size = archive.stat().st_size
          overhead = size - original_total - len(metadata)
          if overhead > zip_overhead_cap or size > cap:
              raise ValueError('actual ZIP overhead/total bound; no upload')
          with zipfile.ZipFile(archive) as z:
              if z.testzip() is not None:
                  raise ValueError('CRC refused')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('allowed=true\npath=' + str(archive) + '\nbytes=' + str(size) + '\n')
          print(json.dumps({'job': job, 'original_bytes': original_total, 'metadata_bytes': len(metadata), 'zip_overhead_bytes': overhead, 'actual_upload_bytes': size, 'cap': cap, 'original_filecount': len(rows), 'upload_filecount': 1, 'artifact_attempts': 1}))
          PY
      - name: Save container and browser evidence once, all bytes bounded
        if: ${{ always() && steps.bound_container.outputs.allowed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.bound_container.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 1
          overwrite: false
